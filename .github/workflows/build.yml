name: Build John xgg Hush (Windows)
on:
  push:
    paths: ['**.zip', '.github/workflows/build.yml']
  workflow_dispatch:
defaults:
  run:
    shell: pwsh
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar o zip do projeto
        run: |
          $zip = Get-ChildItem -Path . -Filter *.zip -File | Select-Object -First 1
          if (-not $zip) { throw "Nenhum .zip encontrado na raiz do repositorio." }
          Expand-Archive -Path $zip.FullName -DestinationPath src -Force
          $cm = Get-ChildItem -Path src -Recurse -Filter CMakeLists.txt | Select-Object -First 1
          "SRC=$($cm.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configurar (CMake baixa o JUCE)
        run: cmake -S "$env:SRC" -B "$env:SRC/build" -A x64
      - name: Compilar
        run: cmake --build "$env:SRC/build" --config Release --parallel
      - name: Reunir arquivos
        run: |
          $a = "$env:SRC/build/JohnXggHush_artefacts/Release"
          New-Item out -ItemType Directory | Out-Null
          Copy-Item "$a/VST3" out/VST3 -Recurse
          Copy-Item "$a/Standalone" out/Standalone -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: JohnXggHush-Windows
          path: out
          
